<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interview practice</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="room">
    <header>
      <p class="eyebrow">Interview practice · <span id="round">Round 1</span></p>
      <h1 id="title">Opening the room…</h1>
      <p id="cast" class="cast"></p>
    </header>
    <ol id="turns" aria-live="polite"></ol>
    <form id="composer">
      <label for="message" class="visually-hidden">What you say</label>
      <textarea id="message" name="message" rows="2" placeholder="Your answer" required disabled></textarea>
      <button type="submit" disabled>Send</button>
      <button type="button" id="finish" class="secondary" disabled>Finish</button>
    </form>
    <section id="debrief" class="debrief" hidden aria-live="polite"></section>
    <div id="again" class="again" hidden>
      <button type="button" data-challenge="same">Practice again</button>
      <button type="button" data-challenge="resistant">Practice again, harder</button>
    </div>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
